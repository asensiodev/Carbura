schema: spec-driven

context: |
  OpenSpec specs, proposals, designs, and tasks must be written in technical English.
  README, PRD, and academic documentation must be written in Spanish.
  Conserva los identificadores, nombres de archivo, rutas, claves de esquema y términos técnicos en su forma obligatoria.
  El alcance de plataformas es una app Android funcional con librerías Kotlin Multiplatform (KMP) compatibles con JVM Desktop.
  No hay app Desktop ni target iOS.

rules:
  proposal:
    - Write in technical English.
  design:
    - Write in technical English.
  specs:
    - Write in technical English while preserving required OpenSpec syntax and identifiers.
  tasks:
    - Write in technical English.
